<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EliteDrive - Membership Applications</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0a0a0a !important;
      color: #f0f0f0 !important;
    }
    .navbar {
      background-color: #1a1a1a;
      border-bottom: 2px solid #c9a84c;
      padding: 5px 0;
      margin-bottom: 30px;
    }
    .navbar-brand {
      color: #c9a84c !important;
      font-weight: bold;
      font-size: 1.5rem;
    }
    .navbar-brand i {
      margin-right: 10px;
    }
    .nav-link {
      color: #f0f0f0 !important;
      margin: 0 10px;
      transition: color 0.3s ease;
      padding: 8px 0;
    }
    .nav-link:hover {
      color: #c9a84c !important;
    }
    h2 {
      color: #c9a84c !important;
      margin-top: 2rem;
      margin-bottom: 2rem;
      font-weight: bold;
    }
    .card {
      background-color: #1a1a1a !important;
      border: 1px solid #c9a84c !important;
      color: #f0f0f0 !important;
    }
    .card-header {
      border-bottom: 1px solid #c9a84c !important;
      font-weight: bold;
      color: #c9a84c !important;
      background-color: rgba(201, 168, 76, 0.1) !important;
    }
    .form-control, .form-select {
      background-color: #2a2a2a !important;
      border: 1px solid #444 !important;
      color: #fff !important;
    }
    .form-control::placeholder {
      color: #888 !important;
    }
    .table {
      --bs-table-bg: #1a1a1a !important;
      --bs-table-color: #f0f0f0 !important;
      color: #f0f0f0 !important;
      border-color: #333 !important;
    }
    .table thead th {
      background-color: #c9a84c !important;
      color: #000 !important;
      text-transform: uppercase;
      font-weight: bold;
      border: none !important;
    }
    .table tbody tr, .table td {
      background-color: #1a1a1a !important;
      color: #f0f0f0 !important;
      border-color: #333 !important;
    }
    .table-hover tbody tr:hover {
      background-color: #252525 !important;
    }
    .btn-gold {
      background-color: #c9a84c !important;
      color: #000 !important;
      font-weight: bold;
      border: none !important;
    }
    .btn-gold:hover {
      background-color: #a88b3a !important;
    }
    .btn-outline-danger {
      color: #ff4d4d !important;
      border-color: #ff4d4d !important;
    }
    .btn-outline-danger:hover {
      background-color: #ff4d4d !important;
      color: #fff !important;
    }
    .badge-pending {
      background-color: #c9a84c !important;
      color: #000 !important;
    }
    .modal-content {
      background-color: #1a1a1a !important;
      color: #f0f0f0 !important;
      border: 1px solid #c9a84c !important;
    }
    .modal-header {
      border-bottom: 1px solid #333 !important;
    }
    .btn-close {
      filter: invert(1) brightness(200%);
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <i class="fas fa-car"></i> EliteDrive
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="branch.html">
            <i class="fas fa-store"></i> Branches
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="member-management.html">
            <i class="fas fa-users"></i> Members
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="cars.html">
            <i class="fas fa-car-side"></i> Cars
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="applications.html">
            <i class="fas fa-file-alt"></i> Applications
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container">
  <h2>EliteDrive Membership Applications</h2>

  <div class="row">
    <div class="col-md-4 mb-4">
      <div class="card shadow">
        <div class="card-header">SUBMIT APPLICATION</div>
        <div class="card-body">
          <form id="addAppForm" onsubmit="addApplication(event)">
            <div class="mb-3">
              <input type="text" id="appName" class="form-control" placeholder="Full Name" required>
            </div>
            <div class="mb-3">
              <input type="email" id="appEmail" class="form-control" placeholder="Email Address" required>
            </div>
            <div class="mb-3">
              <input type="text" id="appLicense" class="form-control" placeholder="Driver's License" required>
            </div>
            <button type="submit" class="btn btn-gold w-100">SUBMIT APPLICATION</button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>APPLICATION QUEUE</span>
          <input type="text" id="searchInput" class="form-control form-control-sm w-50"
                 placeholder="Filter by Status (e.g. PENDING)..." onkeyup="searchApplications()">
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
            </thead>
            <tbody id="appTableBody">
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Review Application</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="editAppForm" onsubmit="saveEdit(event)">
          <input type="hidden" id="editId">
          <div class="mb-3">
            <label class="small">Name</label>
            <input type="text" id="editName" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="small">Email</label>
            <input type="email" id="editEmail" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="small">License</label>
            <input type="text" id="editLicense" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="small">Status</label>
            <select id="editStatus" class="form-select">
              <option value="PENDING">PENDING</option>
              <option value="APPROVED">APPROVED</option>
              <option value="REJECTED">REJECTED</option>
            </select>
          </div>
          <button type="submit" class="btn btn-gold w-100">UPDATE DECISION</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const apiUrl = 'http://localhost:8080/api/applications';
  const editModal = new bootstrap.Modal(document.getElementById('editModal'));

  function getStatusBadge(status) {
    if (status === 'APPROVED') return 'bg-success';
    if (status === 'REJECTED') return 'bg-danger';
    return 'badge-pending';
  }

  function loadApplications(url = apiUrl) {
    fetch(url).then(res => res.json()).then(data => {
      const tbody = document.getElementById('appTableBody');
      tbody.innerHTML = '';
      data.forEach(app => {
        tbody.innerHTML += `
                    <tr>
                        <td>${app.id}</td>
                        <td>${app.applicantName}</td>
                        <td>${app.email}</td>
                        <td>${app.submissionDate}</td>
                        <td><span class="badge ${getStatusBadge(app.status)}">${app.status}</span></td>
                        <td>
                            <div class="d-flex gap-2">
                                <button class="btn btn-sm btn-gold" onclick="openEdit(${app.id}, '${app.applicantName}', '${app.email}', '${app.licenseNumber}', '${app.status}')">Edit</button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteApplication(${app.id})">Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
      });
    });
  }

  function searchApplications() {
    const query = document.getElementById('searchInput').value.toUpperCase();
    loadApplications(query ? `${apiUrl}/search?status=${query}` : apiUrl);
  }

  function addApplication(event) {
    event.preventDefault();
    const data = {
      applicantName: document.getElementById('appName').value,
      email: document.getElementById('appEmail').value,
      licenseNumber: document.getElementById('appLicense').value
    };
    fetch(apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    }).then(() => {
      document.getElementById('addAppForm').reset();
      loadApplications();
    });
  }

  function deleteApplication(id) {
    if (confirm("Delete this application?")) {
      fetch(`${apiUrl}/${id}`, { method: 'DELETE' }).then(() => loadApplications());
    }
  }

  function openEdit(id, name, email, license, status) {
    document.getElementById('editId').value = id;
    document.getElementById('editName').value = name;
    document.getElementById('editEmail').value = email;
    document.getElementById('editLicense').value = license;
    document.getElementById('editStatus').value = status;
    editModal.show();
  }

  function saveEdit(event) {
    event.preventDefault();
    const id = document.getElementById('editId').value;
    const data = {
      applicantName: document.getElementById('editName').value,
      email: document.getElementById('editEmail').value,
      licenseNumber: document.getElementById('editLicense').value,
      status: document.getElementById('editStatus').value
    };
    fetch(`${apiUrl}/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    }).then(() => {
      editModal.hide();
      loadApplications();
    });
  }

  loadApplications();
</script>
</body>
</html>
