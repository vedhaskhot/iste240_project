<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Member Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0a0a0a;
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-top: 2rem;  /* added: space at the top of the page */
        }
        h2, h5 {
            color: #c9a84c;
        }
        h2 {
            text-align: center;
            font-size: 3rem;
            font-weight: 700;
            margin-top: 1rem;
            margin-bottom: 1.5rem;
        }
        .card {
            background-color: #1a1a1a;
            border: 1px solid #c9a84c;
            border-radius: 12px;
        }
        .card-header {
            background-color: #1f1f1f;
            border-bottom: 1px solid #c9a84c;
            color: #c9a84c;
        }
        .table {
            color: #f0f0f0;
            border-color: #333;
        }
        .table thead {
            background-color: #c9a84c;
            color: #000;
        }
        .table thead th {
            border-bottom: none;
            font-weight: 600;
        }
        .table-striped > tbody > tr:nth-of-type(odd) {
            background-color: rgba(201, 168, 76, 0.1);
        }
        .form-control, .form-select {
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: #f0f0f0;
        }
        .form-control:focus, .form-select:focus {
            background-color: #333;
            border-color: #c9a84c;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(201, 168, 76, 0.25);
        }
        label, .form-label {
            color: #c9a84c;
            font-weight: 500;
            margin-bottom: 0.25rem;
        }
        .form-control::placeholder, .form-select::placeholder {
            color: #a0a0a0;
            opacity: 1;
        }
        input[type="date"] {
            color-scheme: dark;
        }
        .form-select option {
            background-color: #2a2a2a;
            color: #f0f0f0;
        }
        .btn-primary {
            background-color: #c9a84c;
            border-color: #c9a84c;
            color: #000;
            font-weight: bold;
        }
        .btn-primary:hover {
            background-color: #b8962e;
            border-color: #b8962e;
            color: #000;
        }
        .btn-outline-primary {
            color: #c9a84c;
            border-color: #c9a84c;
        }
        .btn-outline-primary:hover {
            background-color: #c9a84c;
            color: #000;
        }
        .btn-warning {
            background-color: #c9a84c;
            border-color: #c9a84c;
            color: #000;
        }
        .btn-warning:hover {
            background-color: #b8962e;
            border-color: #b8962e;
            color: #000;
        }
        .toast {
            background-color: #1a1a1a;
            border: 1px solid #c9a84c;
        }
        .toast-header {
            background-color: #1f1f1f;
            color: #c9a84c;
            border-bottom: 1px solid #c9a84c;
        }
        .toast-body {
            color: #f0f0f0;
        }
        html {
            scroll-behavior: smooth;
        }
        .text-gold {
            color: #c9a84c;
        }
        #addMemberButton {
            display: block;
            margin: 0 auto 2rem auto;
            text-align: center;
            font-size: 1.25rem;
            padding: 0.75rem 2rem;
            border-radius: 50px;
            width: auto;
            min-width: 220px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>MEMBERS</h2>
    <button id="addMemberButton" class="btn btn-primary mb-3" onclick="scrollToForm()"> Add a New Member!</button>
    <div class="row mb-3">
            <div class="input-group">
                <input type="text" id="searchInput" class="form-control" placeholder="Search by member name...">
                <button id="searchBtn" class="btn btn-outline-primary">Search</button>
            </div>
    </div>
    <table class="table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Current Car</th>
                <th>Join Date</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="membersTableBody">

        </tbody>
    </table>
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true" data-bs-autohide="true" data-bs-delay="3000">
            <div class="toast-header">
                <strong class="me-auto" id="toastTitle">Notification</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastMessage">Message</div>
        </div>
    </div>
    <div class="card mb-4">
        <div class="card-header">
            <h5 id="userInputFormTitle">Add New Member</h5>
        </div>
        <div class="card-body">
            <form id="newMemberAddForm">
                <input type="hidden" id="memberIdOnForm" value="">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="memberNameOnForm" class="form-label">Full Name</label>
                        <input type="text" id="memberNameOnForm" class="form-control" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="memberEmailOnForm" class="form-label">Email</label>
                        <input type="email" id="memberEmailOnForm" class="form-control" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="currentCarOnForm" class="form-label">Current Car</label>
                        <input type="text" id="currentCarOnForm" class="form-control" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="joinDateOnForm" class="form-label">Join Date</label>
                        <input type="date" id="joinDateOnForm" class="form-control" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="statusOnForm" class="form-label">Status</label>
                        <select id="statusOnForm" class="form-select" required>
                            <option value="">Select status</option>
                            <option value="Active">Active</option>
                            <option value="Pending">Pending</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary me-2">Save Member</button>
                        <button type="button" id="clearFormBtn" class="btn btn-secondary">Clear</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const api_url="/api/members"
    function loadAllMemberRecords(){
        const tbody=document.getElementById("membersTableBody");
        tbody.innerHTML="<tr><td colspan='7'>Please Wait, Loading Member Records...</td></tr>";
        fetch("/api/members").then(response => {
            if (!response.ok) throw new Error("Unable to load Member Records.");
            return response.json();
        }).then(members => {
            tbody.innerHTML="";
            members.forEach(member =>{
                const record=document.createElement("tr");
                const idData=document.createElement("td");
                idData.textContent=member.memberId;
                record.appendChild(idData);

                const nameData=document.createElement("td");
                nameData.textContent=member.memberName;
                record.appendChild(nameData);

                const emailData=document.createElement("td");
                emailData.textContent=member.memberEmail;
                record.appendChild(emailData);

                const currentCarData=document.createElement("td");
                currentCarData.textContent=member.currentCar;
                record.appendChild(currentCarData);

                const joinDateData=document.createElement("td");
                joinDateData.textContent=member.joinDate;
                record.appendChild(joinDateData);

                const statusData=document.createElement("td");
                statusData.textContent=member.status;
                record.appendChild(statusData);

                const actions=document.createElement("td");
                const editBtn=document.createElement("button");
                editBtn.textContent="Edit Record";
                editBtn.className="btn btn-sm btn-warning me-1";
                editBtn.onclick=() => editMember(member.memberId);
                const deleteBtn=document.createElement("button");
                deleteBtn.textContent="Delete Record";
                deleteBtn.className="btn btn-sm btn-danger";
                deleteBtn.onclick=() => deleteMember(member.memberId);
                actions.appendChild(editBtn);
                actions.appendChild(deleteBtn);
                record.appendChild(actions);
                tbody.appendChild(record);
            })
        })
            .catch(error => {
                console.error("Error loading members:", error);
                tbody.innerHTML = "<tr><td colspan='7'>Failed to load members. Check console.</td></tr>";
            });
    }
    document.addEventListener("DOMContentLoaded", loadAllMemberRecords);

    function deleteMember(memberId){
        if (!confirm("Are you sure you want to continue? If continued the record will be erased.")){
            return;
        }
        const tbody = document.getElementById("membersTableBody");
        tbody.innerHTML = "<tr><td colspan='7' class='text-center'>Deleting member...<\/td><\/tr>";
        fetch(`/api/members/${memberId}`,{
            method:"DELETE"
        }).then(response => {
            if (response.ok){
                showToast("Success", "Member deleted successfully!", true);
                loadAllMemberRecords();
            }else{
                showToast("Error", "Delete failed. Status: " + response.status, false);
            }
        }).catch(error => {
            console.error("Error: ",error);
            showToast("Error", "An error occurred during delete.", false);
        });
    }

    function editMember(id) {
        const formTitle = document.getElementById("userInputFormTitle");
        const originalTitle = formTitle.innerText;
        formTitle.innerText = "Loading member data...";
        fetch(`/api/members/${id}`).then(response => {
                if (!response.ok) throw new Error("Member not found");
                return response.json();
            }).then(member => {
                document.getElementById("memberIdOnForm").value = member.memberId;
                document.getElementById("memberNameOnForm").value = member.memberName;
                document.getElementById("memberEmailOnForm").value = member.memberEmail;
                document.getElementById("currentCarOnForm").value = member.currentCar;
                document.getElementById("joinDateOnForm").value = member.joinDate;
                document.getElementById("statusOnForm").value = member.status;
                document.getElementById("userInputFormTitle").innerText = "Edit Member";
                document.getElementById("newMemberAddForm").scrollIntoView({ behavior: "smooth" });
            })
            .catch(error => {
                console.error("Error loading member for edit:", error);
                showToast("Error", "Could not load member data.", false);
            });
    }

    function searchMembers() {
        const searchTerm = document.getElementById("searchInput").value.trim();
        if (searchTerm === "") {
            loadAllMemberRecords();
            return;
        }
        const tbody = document.getElementById("membersTableBody");
        tbody.innerHTML = "<tr><td colspan='7' class='text-center'>Searching...</td></tr>";
        fetch(`/api/members/search?memberName=${encodeURIComponent(searchTerm)}`).then(response => {
                if (!response.ok) throw new Error("Search failed");
                return response.json();
            }).then(members => {
                tbody.innerHTML = "";
                if (members.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='7'>No members found with that name.</td></tr>";
                    return;
                }
                members.forEach(member => {
                    const record = document.createElement("tr");
                    record.innerHTML = `
                    <td>${member.memberId}</td>
                    <td>${member.memberName}</td>
                    <td>${member.memberEmail}</td>
                    <td>${member.currentCar}</td>
                    <td>${member.joinDate}</td>
                    <td>${member.status}</td>
                    <td>
                        <button class="btn btn-sm btn-warning me-1" onclick="editMember(${member.memberId})">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteMember(${member.memberId})">Delete</button>
                    </td>
                `;
                    tbody.appendChild(record);
                });
            })
            .catch(error => {
                console.error("Search error:", error);
                tbody.innerHTML = "<tr><td colspan='7'>Error searching.</td></tr>";
            });
    }
    document.getElementById("searchBtn").addEventListener("click", searchMembers);

    document.getElementById("newMemberAddForm").addEventListener("submit", function(event) {
        event.preventDefault();
        const submitBtn = this.querySelector("button[type='submit']");
        const originalText = submitBtn.innerText;
        submitBtn.disabled = true;
        submitBtn.innerText = "Saving...";
        const memberId = document.getElementById("memberIdOnForm").value;
        const memberData = {
            memberName: document.getElementById("memberNameOnForm").value,
            memberEmail: document.getElementById("memberEmailOnForm").value,
            currentCar: document.getElementById("currentCarOnForm").value,
            joinDate: document.getElementById("joinDateOnForm").value,
            status: document.getElementById("statusOnForm").value
        };
        let url = "/api/members";
        let method = "POST";
        if (memberId) {
            url = `/api/members/${memberId}`;
            method = "PUT";
        }
        fetch(url, {
            method: method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(memberData)
        }).then(response => {
                if (response.ok) {
                    showToast("Success", memberId ? "Member updated!" : "Member created!", true);
                    document.getElementById("memberIdOnForm").value = "";
                    document.getElementById("newMemberAddForm").reset();
                    document.getElementById("userInputFormTitle").innerText = "Add New Member";
                    loadAllMemberRecords();
                } else {
                    showToast("Error", "Operation failed. Status: " + response.status, false);
                }
            }).catch(error => {
                console.error("Error:", error);
                showToast("Error", "An error occurred.", false);
            });
    });
    document.getElementById("addMemberButton").addEventListener("click", function() {
        document.getElementById("memberIdOnForm").value = "";
        document.getElementById("newMemberAddForm").reset();
        document.getElementById("userInputFormTitle").innerText = "Add New Member";
        scrollToForm();
    });
    function scrollToForm() {
        const formElement = document.getElementById("newMemberAddForm");
        formElement.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function showToast(title, message, isSuccess = true) {
        const toastEl = document.getElementById('liveToast');
        const toastTitle = document.getElementById('toastTitle');
        const toastBody = document.getElementById('toastMessage');
        toastTitle.textContent = title;
        toastBody.textContent = message;
        const header = toastEl.querySelector('.toast-header');
        header.classList.remove('bg-success', 'bg-danger', 'text-white');
        if (isSuccess) {
            header.classList.add('bg-success', 'text-white');
        } else {
            header.classList.add('bg-danger', 'text-white');
        }
        const bsToast = new bootstrap.Toast(toastEl);
        bsToast.show();
    }
</script>
</body>
</html>
