spring.application.name=EliteDrive
# This tells the app exactly where your local MySQL server lives.
# The '?createDatabaseIfNotExist=true' part automatically creates the iste240 database!
spring.datasource.url=jdbc:mysql://localhost:3306/iste240?createDatabaseIfNotExist=true

# Replace these with your actual MySQL username and password (default is usually 'root' and 'root')
spring.datasource.username=root
spring.datasource.password=root

# This tells the app it is talking to a MySQL database
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# This automatically turns your Java Entity files into actual MySQL tables every time you run the app
spring.jpa.hibernate.ddl-auto=update

# This shows the database commands in the console so you can see what is happening
spring.jpa.show-sql=true
